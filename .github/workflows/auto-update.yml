name: Automatically Upstream Purpur

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 */3 * *"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Nitro repository
        uses: actions/checkout@v5
        with:
          path: 'Nitro'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout Purpur repository
        uses: actions/checkout@v5
        with:
          path: 'Purpur'
          repository: "PurpurMC/Purpur"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Purpur latest commit Hash
        id: purpurCommit
        run: |
          cd Purpur
          echo "purpurCommit=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Get Current Purpur commit Hash
        id: currPurpurCommit
        run: |
          cd Nitro
          currPurpurCommit=$(grep "^purpurCommit\s*=" gradle.properties | sed 's/^purpurCommit\s*=\s*//')
          echo "currPurpurCommit=$currPurpurCommit" >> $GITHUB_OUTPUT

      - name: Update purpurCommit in Nitro
        run: |
          cd Nitro
          sed -i "s/\(purpurCommit\s*=\s*\).*/\1$PURPUR_COMMIT/" gradle.properties
        env:
          PURPUR_COMMIT: ${{ steps.purpurCommit.outputs.purpurCommit }}

      - name: Setup Git and Gradle
        run: |
          cd Nitro
          git config --global user.email "action@github.com"
          git config --global user.name "Github Action"
          chmod +x gradlew

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Running tests before push
        run: |
          cd Nitro
          if ! git diff --quiet; then
            echo "Running tests...."
            ./gradlew applyAllPatches
            ./gradlew build -x test
            ./gradlew rebuildPurpurPatches
            ./gradlew rebuildAllServerPatches
          fi

      - name: Check for changes and write to repository
        run: |
          cd Nitro
          if ! git diff --quiet; then
            echo "Writing to repo....."
            git add .
            chmod +x ./scripts/upstreamCommit.sh
            ./scripts/upstreamCommit.sh $CURR_PURPUR_COMMIT
            git push
          else
            echo "No changes to commit."
          fi
        env:
          CURR_PURPUR_COMMIT: ${{ steps.currPurpurCommit.outputs.currPurpurCommit }}
